<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#15803d" />
  <title>Check-in · Consulta ORL</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/checkin.css" />
</head>
<body>
  <main class="kiosk">
    <!-- Reloj (hora local de Ychoux) -->
    <div id="clock" class="clock" aria-hidden="true">00:00</div>

    <!-- Vista: formulario de llegada -->
    <section id="form-view" class="card">
      <h1 class="welcome" data-i18n="welcome">BIENVENUE</h1>
      <p class="instruction" data-i18n="instruction">Veuillez saisir vos informations :</p>

      <form id="checkin-form" novalidate>
        <label class="field">
          <span class="field-label" data-i18n="lastName">NOM DE FAMILLE</span>
          <input id="last-name" name="last-name" type="text"
                 autocomplete="off" autocapitalize="characters"
                 inputmode="text" required />
        </label>

        <label class="field">
          <span class="field-label" data-i18n="birthYear">ANNÉE DE NAISSANCE</span>
          <input id="birth-year" name="birth-year" type="text"
                 inputmode="numeric" pattern="\d*" maxlength="4"
                 autocomplete="off" required />
        </label>

        <p id="error" class="error" role="alert" hidden></p>

        <button id="submit-btn" class="arrive-btn" type="submit" data-i18n="arrive">SIGNALER MON ARRIVÉE</button>
      </form>
    </section>

    <!-- Vista: confirmación -->
    <section id="confirm-view" class="card confirm" hidden>
      <div class="check-mark" aria-hidden="true">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="24" fill="none" />
          <path fill="none" d="M14 27 l8 8 l16 -16" />
        </svg>
      </div>
      <h1 class="confirm-title" data-i18n="confirmTitle">Merci</h1>
      <p class="confirm-text" data-i18n="confirmText">Nous vous appellerons prochainement.</p>
      <button id="again-btn" class="again-btn" type="button" data-i18n="again">Nouveau patient</button>
    </section>

    <!-- Vista: posible duplicado -->
    <section id="duplicate-view" class="card" hidden>
      <h1 class="confirm-title" data-i18n="dupTitle">Vous enregistrer à nouveau ?</h1>
      <p class="confirm-text" data-i18n="dupText">Un enregistrement récent existe déjà avec ces données.</p>
      <button id="dup-already" class="arrive-btn" type="button" data-i18n="dupAlready">Non, je suis déjà enregistré</button>
      <button id="dup-again" class="again-btn" type="button" data-i18n="dupAgain">Oui, m'enregistrer à nouveau</button>
    </section>
  </main>

  <script type="module" src="assets/js/checkin.js"></script>
</body>
</html>
